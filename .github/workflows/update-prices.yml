# Refreshes js/prices-data.js with the latest U.S. Bureau of Labor Statistics grocery prices.
# BLS publishes new numbers around the middle of each month, so this checks twice a month.
# You can also run it any time from the repository's Actions tab ("Update prices" → Run workflow).
name: Update prices

on:
  schedule:
    - cron: '0 15 16,26 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get latest prices
        run: node tools/update-prices.js
      - name: Save if changed
        run: |
          if git diff --quiet; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/prices-data.js
          git commit -m "Update grocery prices from BLS"
          git push
